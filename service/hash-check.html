<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="GoldBigDragon">
  <meta name="description" content="GoldBigDragon — Hash Check">
  <meta name="theme-color" content="#101011">
  <title>GoldBigDragon — Hash Check</title>
  <link rel="icon" href="/resources/img/service/logo/hash-check.ico">
  <link rel="stylesheet" href="/resources/css/theme.css?v=6">
  <link rel="stylesheet" href="/resources/css/service/hash-check.css?v=4">
</head>
<body data-page="service">
  <button type="button" class="corner tl" id="menuBtn" aria-expanded="false"></button>
  <button type="button" class="corner tr" id="langBtn" aria-expanded="false">
    <img class="lang-flag" src="/resources/img/header/lang/kr.png" alt="" width="28" height="28">
  </button>
  <main class="page">
    <header class="page-head">
      <h1 class="lang" data-lang-var="HASH_CHECK_LANG" data-lang="title">Hash Check</h1>
    </header>
    <div class="tool">
      <label class="dropzone" id="dropZone">
        <span class="lang" data-lang-var="HASH_CHECK_LANG" data-lang="container">Drop files here or tap to select</span>
        <input type="file" id="fileInput" multiple>
      </label>
      <div class="tool-bar">
        <button type="button" class="btn danger" id="clearHistoryButton">
          <span class="lang" data-lang-var="HASH_CHECK_LANG" data-lang="clear">Clear</span>
        </button>
        <button type="button" class="btn" id="csvBtn" disabled>CSV</button>
        <button type="button" class="btn primary" id="jsonBtn" disabled>JSON</button>
      </div>
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
      </div>
      <div class="result-list" id="downloadLinks"></div>
      <p class="note lang" data-lang-var="HASH_CHECK_LANG" data-lang="description">Files stay on this device.</p>
    </div>
  </main>
  <div id="toastContainer" class="toast-container"></div>
  <script src="/resources/js/core.js?v=7"></script>
  <script src="/resources/js/utils/toast.js"></script>
  <script src="/resources/lang/service/hash-check.js?v=4"></script>
  <script src="/resources/js/service/hash-check.js?v=5"></script>
</body>
</html>
