<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="GoldBigDragon">
  <meta name="description" content="GoldBigDragon — Image Converter">
  <meta name="theme-color" content="#0c0c0e">
  <title>GoldBigDragon — Image Converter</title>
  <link rel="icon" href="/resources/img/service/logo/image-converter.ico">
  <link rel="stylesheet" href="/resources/css/theme.css?v=4">
  <link rel="stylesheet" href="/resources/css/service/image-converter.css?v=4">
</head>
<body data-page="service">
  <button type="button" class="corner tl" id="menuBtn" aria-expanded="false"></button>
  <button type="button" class="corner tr" id="langBtn" aria-expanded="false">
    <img class="lang-flag" src="/resources/img/header/lang/kr.png" alt="" width="28" height="28">
  </button>
  <main class="page">
    <header class="page-head">
      <h1 class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="title">Image Converter</h1>
    </header>
    <div class="tool">
      <label class="dropzone" id="dropZone">
        <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="container">Drop images here or tap to select</span>
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp,image/x-icon,.ico" multiple>
      </label>
      <div class="tool-panel">
        <div class="field">
          <div class="field-label lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="convert_format">Format</div>
          <div class="seg" id="formatSeg" role="group">
            <button type="button" class="is-on" data-format="png">PNG</button>
            <button type="button" data-format="jpeg">JPEG</button>
            <button type="button" data-format="webp">WEBP</button>
            <button type="button" data-format="ico">ICO</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="image_size">Size</div>
          <div class="seg" id="sizeSeg">
            <button type="button" class="is-on" id="relativeSizeButton" data-size="relative">
              <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="relative_size">Relative</span>
            </button>
            <button type="button" id="absoluteSizeButton" data-size="absolute">
              <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="absolute_size">Absolute</span>
            </button>
          </div>
          <div class="field-row" id="relativeSizeInputs">
            <label>
              <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="percentage">Scale</span>
              <select id="percentageInput">
                <option value="100">100%</option>
                <option value="75">75%</option>
                <option value="50">50%</option>
                <option value="25">25%</option>
              </select>
            </label>
          </div>
          <div class="field-row" id="absoluteSizeInputs" hidden>
            <label>
              <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="width">Width</span>
              <input type="number" id="widthInput" value="256" min="1" max="8192">
            </label>
            <label>
              <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="height">Height</span>
              <input type="number" id="heightInput" value="256" min="1" max="8192">
            </label>
          </div>
        </div>
        <div class="field">
          <div class="field-label lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="image_compress">Compress</div>
          <div class="field-row">
            <select id="compressStrength">
              <option value="0" class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="compress_0">No compression</option>
              <option value="1" class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="compress_1">Slight</option>
              <option value="2" selected class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="compress_2">Moderate</option>
              <option value="3" class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="compress_3">Compressed</option>
              <option value="4" class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="compress_4">Heavy</option>
              <option value="5" class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="compress_5">Maximum</option>
            </select>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="removeBg">
          <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="remove_bg">Remove background</span>
        </label>
      </div>
      <div class="tool-bar">
        <button type="button" class="btn danger" id="clearHistoryButton">
          <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="clear">Clear</span>
        </button>
        <button type="button" class="btn primary" id="downloadAllButton" disabled>
          <span class="lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="download_zip">Download ZIP</span>
        </button>
      </div>
      <div class="result-list" id="downloadLinks"></div>
      <p class="note lang" data-lang-var="IMAGE_CONVERTER_LANG" data-lang="description">Files stay on this device.</p>
    </div>
  </main>
  <div id="toastContainer" class="toast-container"></div>
  <script src="/resources/js/core.js?v=4"></script>
  <script src="/resources/js/utils/toast.js"></script>
  <script src="/resources/lang/service/image-converter.js?v=4"></script>
  <script src="/resources/js/service/image-compress.js?v=4"></script>
  <script src="/resources/js/service/image-converter.js?v=4"></script>
</body>
</html>
