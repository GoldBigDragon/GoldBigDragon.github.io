<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="GoldBigDragon">
  <meta name="description" content="GoldBigDragon — PDF Editor">
  <meta name="theme-color" content="#101011">
  <title>GoldBigDragon — PDF Editor</title>
  <link rel="icon" href="/resources/img/service/logo/pdf-editor.ico">
  <script src="/resources/vendor/pdf.2.10.377.min.js"></script>
  <script src="/resources/vendor/pdf-lib.1.17.1.min.js"></script>
  <link rel="stylesheet" href="/resources/css/theme.css?v=6">
  <link rel="stylesheet" href="/resources/css/service/pdf-editor.css?v=4">
</head>
<body data-page="service">
  <button type="button" class="corner tl" id="menuBtn" aria-expanded="false"></button>
  <button type="button" class="corner tr" id="langBtn" aria-expanded="false">
    <img class="lang-flag" src="/resources/img/header/lang/kr.png" alt="" width="28" height="28">
  </button>
  <main class="page">
    <header class="page-head">
      <h1 class="lang" data-lang-var="PDF_EDITOR_LANG" data-lang="title">PDF Editor</h1>
    </header>
    <div class="tool">
      <label class="dropzone" id="dropZone">
        <span class="lang" data-lang-var="PDF_EDITOR_LANG" data-lang="container">Drop PDF files here or tap to select</span>
        <input type="file" id="pdfInput" accept="application/pdf" multiple>
      </label>
      <div class="tool-bar">
        <button type="button" class="btn danger" id="resetButton">
          <span class="lang" data-lang-var="PDF_EDITOR_LANG" data-lang="clear">Clear</span>
        </button>
        <button type="button" class="btn primary" id="exportPdf" disabled>
          <span class="lang" data-lang-var="PDF_EDITOR_LANG" data-lang="export_pdf">Export PDF</span>
        </button>
        <button type="button" class="btn" id="exportPng" disabled>
          <span class="lang" data-lang-var="PDF_EDITOR_LANG" data-lang="export_png">Export PNG</span>
        </button>
      </div>
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <div class="lang" data-lang-var="PDF_EDITOR_LANG" data-lang="working">Working…</div>
      </div>
      <div class="pdf-grid" id="pdfContainer"></div>
      <p class="note lang" data-lang-var="PDF_EDITOR_LANG" data-lang="description">Files stay on this device. Drag pages to reorder.</p>
    </div>
  </main>
  <div id="toastContainer" class="toast-container"></div>
  <script src="/resources/js/core.js?v=7"></script>
  <script src="/resources/js/utils/toast.js"></script>
  <script src="/resources/js/service/image-compress.js?v=4"></script>
  <script src="/resources/lang/service/pdf-editor.js?v=4"></script>
  <script src="/resources/js/service/pdf-editor.js?v=4"></script>
</body>
</html>
