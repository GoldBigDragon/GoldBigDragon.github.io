<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="GoldBigDragon">
  <meta name="description" content="GoldBigDragon — TaeRyong Kim">
  <meta name="theme-color" content="#101011">
  <title>GoldBigDragon</title>
  <link rel="icon" href="/resources/img/favicon.ico">
  <link rel="stylesheet" href="/resources/css/theme.css?v=6">
</head>
<body data-page="home">
  <button type="button" class="corner tl" id="menuBtn" aria-expanded="false" aria-controls="menuOverlay"></button>
  <button type="button" class="corner tr" id="langBtn" aria-expanded="false" aria-controls="langOverlay">
    <img class="lang-flag" src="/resources/img/header/lang/kr.png" alt="" width="28" height="28">
  </button>

  <nav class="dock" aria-label="Portfolio">
    <button type="button" class="dock-btn" data-cat="career" aria-label="Career"></button>
    <button type="button" class="dock-btn" data-cat="education" aria-label="Education"></button>
    <button type="button" class="dock-btn" data-cat="certificate" aria-label="Certificate"></button>
    <button type="button" class="dock-btn" data-cat="etc" aria-label="Awards"></button>
  </nav>

  <main class="stage">
    <section class="calling-card">
      <div class="portrait">
        <img src="/resources/img/index/profile-image.png" width="220" height="220" alt="GoldBigDragon">
        <span class="portrait-caption" data-i18n="logoDescription">동양 용 문양</span>
      </div>
      <div class="identity">
        <h1 data-i18n="nameValue">김태룡</h1>
        <div class="meta" data-i18n="countryValue">대한민국</div>
      </div>
      <a class="mail-link" href="mailto:dnwndugod642@naver.com">
        <span data-i18n="contact">연락처</span>
        <span>dnwndugod642@naver.com</span>
      </a>
      <div class="social">
        <a href="https://cafe.naver.com/goldbigdragon" target="_blank" rel="noopener noreferrer" aria-label="Naver Cafe" id="linkCafe"></a>
        <a href="https://www.youtube.com/@GoldBigDragon" target="_blank" rel="noopener noreferrer" aria-label="YouTube" id="linkYt"></a>
        <a href="https://github.com/GoldBigDragon" target="_blank" rel="noopener noreferrer" aria-label="GitHub" id="linkGh"></a>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <button type="button" class="icon-btn" id="modalBack" hidden></button>
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" id="modalClose"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/resources/data/index/career.js"></script>
  <script src="/resources/data/index/education.js"></script>
  <script src="/resources/data/index/certificate.js"></script>
  <script src="/resources/data/index/etc.js"></script>
  <script src="/resources/js/core.js?v=7"></script>
  <script src="/resources/js/home.js?v=6"></script>
  <script>
    document.getElementById("linkCafe").innerHTML = GBD.ICON.cafe;
    document.getElementById("linkYt").innerHTML = GBD.ICON.youtube;
    document.getElementById("linkGh").innerHTML = GBD.ICON.github;
    document.querySelector('[data-cat="career"]').innerHTML = GBD.ICON.briefcase;
    document.querySelector('[data-cat="education"]').innerHTML = GBD.ICON.education;
    document.querySelector('[data-cat="certificate"]').innerHTML = GBD.ICON.medal;
    document.querySelector('[data-cat="etc"]').innerHTML = GBD.ICON.trophy;
    document.getElementById("modalBack").innerHTML = GBD.ICON.back;
    document.getElementById("modalClose").innerHTML = GBD.ICON.close;
    document.querySelector(".mail-link").insertAdjacentHTML("afterbegin", GBD.ICON.mail);
  </script>
</body>
</html>
