<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0e0e10">
  <meta name="description" content="GoldBigDragon 웹 AI 봇 — 내부 테스트 (직접 URL만)">
  <title>웹 AI 봇</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button type="button" class="icon-btn" id="btnSettings" aria-label="설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13a7.7 7.7 0 0 0 .1-2l2-1.2-2-3.4-2.3.5a8 8 0 0 0-1.7-1L15 3.5h-4l-.5 2.4a8 8 0 0 0-1.7 1L6.5 6.4l-2 3.4 2 1.2a7.7 7.7 0 0 0 0 2l-2 1.2 2 3.4 2.3-.5a8 8 0 0 0 1.7 1l.5 2.4h4l.5-2.4a8 8 0 0 0 1.7-1l2.3.5 2-3.4-2-1.2Z"/></svg>
      </button>
      <div class="brand">
        <h1>웹 AI 봇</h1>
        <p id="brandSub">GoldBigDragon · 창립 대기</p>
      </div>
      <button type="button" class="icon-btn" id="btnRoutines" aria-label="루틴">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
    </header>
    <div class="workspace">
      <nav class="rail" id="botRail" aria-label="봇"></nav>
      <section class="chat">
        <div class="chat-head" id="chatHead"></div>
        <div class="chat-log" id="chatLog"></div>
        <form class="composer" id="composer">
          <div class="composer-box">
            <textarea id="composerInput" maxlength="8000" rows="1" placeholder="관리자에게 전달"></textarea>
            <select id="modelSelect" aria-label="모델"></select>
            <button type="submit" class="send" aria-label="보내기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
            </button>
          </div>
          <p class="count" id="charCount">0/8000</p>
        </form>
      </section>
      <aside class="routines" id="routineCol">
        <div class="r-head">
          <p>루틴</p>
          <button type="button" id="btnAddRoutine">추가</button>
        </div>
        <form class="r-form hidden" id="routineForm"></form>
        <ul class="r-list" id="routineList"></ul>
      </aside>
    </div>
    <footer class="status" id="statusBar"></footer>
  </div>

  <div class="modal hidden" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-card">
      <header>
        <div>
          <h2 id="settingsTitle">설정</h2>
          <p>키는 Python HQ가 AES-GCM으로 암호화해 디스크에 저장합니다. 이 페이지는 표시만 합니다.</p>
        </div>
        <button type="button" class="icon-btn" id="btnCloseSettings" aria-label="닫기">×</button>
      </header>
      <div class="tabs" id="settingsTabs"></div>
      <div class="modal-body" id="settingsBody"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
