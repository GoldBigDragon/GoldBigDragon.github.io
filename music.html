<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="GoldBigDragon">
  <meta name="description" content="GoldBigDragon — Music">
  <meta name="theme-color" content="#0c0c0e">
  <title>GoldBigDragon — Music</title>
  <link rel="icon" href="/resources/img/favicon.ico">
  <link rel="stylesheet" href="/resources/css/theme.css?v=5">
</head>
<body data-page="music">
  <button type="button" class="corner tl" id="menuBtn" aria-expanded="false"></button>
  <button type="button" class="corner tr" id="langBtn" aria-expanded="false">
    <img class="lang-flag" src="/resources/img/header/lang/kr.png" alt="" width="28" height="28">
  </button>

  <main class="page">
    <header class="page-head">
      <h1 data-i18n="music">Music</h1>
    </header>

    <div class="tabs" role="tablist">
      <button type="button" class="tab" id="tabPlaylist" role="tab" aria-selected="true" data-i18n="playlist">Playlist</button>
      <button type="button" class="tab" id="tabTracks" role="tab" aria-selected="false" data-i18n="tracks">Tracks</button>
    </div>

    <form class="search-bar" id="searchForm">
      <select id="searchField" hidden>
        <option value="title" data-i18n="nameField">Title</option>
        <option value="tag">Tag</option>
        <option value="playlist">Playlist</option>
        <option value="composed-with">Tool</option>
      </select>
      <input id="searchInput" type="search" placeholder="Search">
      <button type="submit" data-i18n="search">Search</button>
    </form>

    <section class="card-grid" id="catalog"></section>

    <div class="player" id="player">
      <img id="playerArt" alt="">
      <div class="player-meta">
        <strong id="playerTitle">—</strong>
        <div class="timeline" id="timeline"><div class="bar" id="progress"></div></div>
        <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
      </div>
      <div class="player-controls">
        <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous"></button>
        <button type="button" class="icon-btn" id="playBtn" aria-label="Play"></button>
        <button type="button" class="icon-btn" id="nextBtn" aria-label="Next"></button>
      </div>
    </div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" id="modalClose"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/resources/js/core.js?v=5"></script>
  <script src="/resources/data/music/music_list.js"></script>
  <script src="/resources/js/music.js?v=5"></script>
  <script>
    document.getElementById("prevBtn").innerHTML = GBD.ICON.prev;
    document.getElementById("playBtn").innerHTML = GBD.ICON.play;
    document.getElementById("nextBtn").innerHTML = GBD.ICON.next;
    document.getElementById("modalClose").innerHTML = GBD.ICON.close;
  </script>
</body>
</html>
