<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="GoldBigDragon">
  <meta name="description" content="GoldBigDragon — Cartoon">
  <meta name="theme-color" content="#101011">
  <title>GoldBigDragon — Cartoon</title>
  <link rel="icon" href="/resources/img/favicon.ico">
  <link rel="stylesheet" href="/resources/css/theme.css?v=6">
</head>
<body data-page="cartoon">
  <button type="button" class="corner tl" id="menuBtn" aria-expanded="false"></button>
  <button type="button" class="corner tr" id="langBtn" aria-expanded="false">
    <img class="lang-flag" src="/resources/img/header/lang/kr.png" alt="" width="28" height="28">
  </button>

  <main class="page">
    <header class="page-head" id="pageHead">
      <h1 id="pageTitle">
        <span class="crumb" id="crumbRoot" data-i18n="cartoon">Cartoon</span><span class="crumb-sep" id="crumbSep" hidden> / </span><span class="crumb-leaf" id="crumbLeaf" hidden></span>
      </h1>
    </header>

    <section class="cover-grid covers" id="coverArea"></section>

    <section class="reader" id="reader" hidden>
      <div class="reader-title">
        <h2 id="readerTitle"></h2>
        <time id="readerDate"></time>
      </div>
      <div class="page-frame" id="pageFrame">
        <button type="button" class="page-mover landscape-only" id="prevPage" aria-label="Previous"></button>
        <img id="pageImage" alt="">
        <button type="button" class="page-mover landscape-only" id="nextPage" aria-label="Next"></button>
      </div>
      <div class="reader-nav" id="readerNav">
        <button type="button" class="page-mover portrait-only" id="prevPageBar" aria-label="Previous"></button>
        <select id="pageSelect" class="landscape-only" aria-label="Page"></select>
        <input id="pageInput" type="number" min="1" value="1" aria-label="Page number">
        <span class="page-slash">/</span>
        <span id="maxPage">0</span>
        <button type="button" class="icon-btn landscape-only" id="pageGo"></button>
        <button type="button" class="page-mover portrait-only" id="nextPageBar" aria-label="Next"></button>
      </div>
    </section>
  </main>

  <script src="/resources/js/core.js?v=7"></script>
  <script src="/resources/data/cartoon/cartoon_list.js"></script>
  <script src="/resources/js/cartoon.js?v=6"></script>
  <script>
    document.getElementById("pageGo").innerHTML = GBD.ICON.search;
    document.getElementById("prevPage").innerHTML = GBD.ICON.back;
    document.getElementById("nextPage").innerHTML = GBD.ICON.next;
    document.getElementById("prevPageBar").innerHTML = GBD.ICON.back;
    document.getElementById("nextPageBar").innerHTML = GBD.ICON.next;
  </script>
</body>
</html>
