<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="GoldBigDragon">
  <meta name="description" content="GoldBigDragon — Cartoon">
  <meta name="theme-color" content="#0c0c0e">
  <title>GoldBigDragon — Cartoon</title>
  <link rel="icon" href="/resources/img/favicon.ico">
  <link rel="stylesheet" href="/resources/css/theme.css">
</head>
<body data-page="cartoon">
  <button type="button" class="corner tl" id="menuBtn" aria-expanded="false"></button>
  <button type="button" class="corner tr" id="langBtn" aria-expanded="false"></button>

  <main class="page">
    <header class="page-head">
      <div class="kicker">GoldBigDragon</div>
      <h1 data-i18n="cartoon">Cartoon</h1>
    </header>

    <section class="cover-grid covers" id="coverArea"></section>

    <section class="reader" id="reader" hidden>
      <div class="reader-nav">
        <button type="button" class="icon-btn" id="readerBack"></button>
        <select id="pageSelect" aria-label="Page"></select>
        <input id="pageInput" type="number" min="1" value="1" aria-label="Page number">
        <span>/</span>
        <span id="maxPage">0</span>
        <button type="button" class="icon-btn" id="pageGo"></button>
      </div>
      <div class="reader-title">
        <h2 id="readerTitle"></h2>
        <time id="readerDate"></time>
      </div>
      <div class="page-frame" id="pageFrame">
        <button type="button" class="page-mover" id="prevPage" aria-label="Previous"></button>
        <img id="pageImage" alt="">
        <button type="button" class="page-mover" id="nextPage" aria-label="Next"></button>
      </div>
    </section>
  </main>

  <script src="/resources/js/core.js"></script>
  <script src="/resources/data/cartoon/cartoon_list.js"></script>
  <script src="/resources/js/cartoon.js"></script>
  <script>
    document.getElementById("readerBack").innerHTML = GBD.ICON.back;
    document.getElementById("pageGo").innerHTML = GBD.ICON.search;
    document.getElementById("prevPage").innerHTML = GBD.ICON.back;
    document.getElementById("nextPage").innerHTML = GBD.ICON.next;
  </script>
</body>
</html>
