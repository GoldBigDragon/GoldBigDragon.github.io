rnet-based P2P chat.","지식 문서함(Knowledge) 기능이 추가되었습니다.":"The Knowledge library feature was added.","매듭법(Knots), 비누(Soap), 일일 권장 섭취량(Daily Recommended Nutrient Intake), 플라스틱 병 전구(Plastic Bottle Bulb), 양초(Candle), 정수(Water Purification), 수원지(Water Source) 지식이 추가되었습니다.":"Knowledge articles were added on knots, soap, daily recommended nutrient intake, plastic-bottle bulbs, candles, water purification, and water sources.","식품 보존(Food Preservation), 응급처치(First aid) 지식이 추가되었습니다.":"Knowledge articles on food preservation and first aid were added.","지식 문서 다운로드 기능이 추가되었습니다.":"Knowledge documents can now be downloaded.","지식 문서 뷰어에서 라이트/다크 모드를 지원합니다.":"The knowledge document viewer now supports light and dark modes.","부관(Aide) 다운로드 기능이 추가되었습니다.":"Aide downloads were added.","White 캐릭터를 재구상하였습니다.":"I redesigned the White character concept.","아이콘(Icon) 다운로드 기능이 추가되었습니다.":"Icon downloads were added.","재난 상황 행동 요령(Disaster Situation) 기능이 추가되었습니다.":"The Disaster Situation guidance feature was added.","화산(Volcanic eruption), 폭염(Heat wave), 가뭄(Drought), 쓰나미(Tsunami), 조수(Tide), 폭우(Downpour), 홍수(Flood), 적조(Red tide), 녹조(Green tide), 폭설(Heavy snowfall), 한파(Cold wave), 태풍(Typhoon), 강풍(Strong wind), 낙뢰(Lightning strike), 황사(Yellow dust), 지진(Earthquake), 산사태(Landslide), 우주 전파 재난(Space weather disaster), 자연 우주 물체 추락(Natural space object impact)에 대한 자연 재해 행동 요령이 추가되었습니다.":"Natural-disaster guidance was added for volcanic eruptions, heat waves, droughts, tsunamis, tides, downpours, floods, red tides, green tides, heavy snow, cold waves, typhoons, strong winds, lightning strikes, yellow dust, earthquakes, landslides, space-weather disasters, and natural space-object impacts.","해파리 대량 출현(Mass jellyfish occurrence)에 대한 생활 안전 요령이 추가되었습니다.":"Everyday-safety guidance was added for mass jellyfish occurrences.","경보(Alert), 대피(Evacuation), 폭격(Shelling), 드론 공습(UAV Strike)에 대한 전쟁 행동 요령이 추가되었습니다.":"Wartime guidance was added for alerts, evacuation, shelling, and UAV strikes.","건물 붕괴(Building Collapse), 다중  added to organization and operations tools.","조직·운영 도구에 환자 격리 관리(Patient Isolation Management) 기능이 추가되었습니다.":"Patient Isolation Management was added to organization and operations tools.","조직·운영 도구에 배급표(Ration Ticket) 기능이 추가되었습니다.":"A Ration Ticket feature was added to organization and operations tools.","도구에 메트로놈(Metronome) 기능이 추가되었습니다.":"A Metronome was added to the tools.","도구에 MIDI 작곡기(MIDI Composer) 기능이 추가되었습니다.":"A MIDI Composer was added to the tools.","생존 도구에 [국민안전24](https://www.safekorea.go.kr/)에서 제공하는 [안전지도](https://safemap.go.kr/main/smap_renewal.do) 페이지로 이동하는 링크가 추가되었습니다.":"A link was added in survival tools to the [Safety Map](https://safemap.go.kr/main/smap_renewal.do) provided by [National Safety 24](https://www.safekorea.go.kr/).","생존 도구에 [국민안전24](https://www.safekorea.go.kr/)에서 제공하는 [재난문자](https://www.safekorea.go.kr/safekorea-kor/ctim/cmsg/calamitySms.do) 페이지로 이동하는 링크가 추가되었습니다.":"A link was added in survival tools to [disaster alerts](https://www.safekorea.go.kr/safekorea-kor/ctim/cmsg/calamitySms.do) provided by [National Safety 24](https://www.safekorea.go.kr/).","지식 문서가 페이징 기능을 지원하게 되었습니다.":"Knowledge documents now support pagination.","보스니아 내전 생존자 Selco와의 인터뷰(Interview with Bosnian war survivor Selco) 지식이 추가되었습니다.":"A knowledge article featuring an interview with Bosnian War survivor Selco was added.","[대학 과제 ](/SurvivalManager/devlog_resources/2026_06_05.pdf) 제출겸 부관(Aide) 캐릭터 디자인을 다듬었습니다.":"I refined the Aide character design while preparing a [university assignment](/SurvivalManager/devlog_resources/2026_06_05.pdf).","태양광 발전기 설치(Solar panel installation) 지식이 추가되었습니다.":"A knowledge article on solar panel installation was added.","오프라인 지도(Offline Map)에서 GPS 활성화 시 현재 위치가 표시되는 기능이 추가되었습니다.":"The Offline Map now displays the current location when GPS is enabled.","환자 격리 관리(Patient Isolation Management)에서 추적 그래프 저장 버튼이 추가되었습니다.":"A button to save tracking graphs was added to Patient Isolation Management.","애플리케이션 내에서 에피소드 및 스토리 열람 시 재생될 BGM [Time to play](/resources/files/music/suno/Time%20to%20play.mp3)가 작곡되었습니다.":"The BGM [Time to play](/resources/files/music/suno/Time%20to%20play.mp3), intended to play while viewing episodes and stories in the app, was composed.","생존 도구에 식수 소독 계산기(Water Purification Calculator) 기능이 추가되었습니다.":"A Water Purification Calculator was added to survival tools.","조직·운영 도구에 환자 분류(Patient Triage) 기능이 추가되었습니다.":"Patient Triage was added to organization and operations tools.","P2P 채팅 시스템이 BLE, WiFi-Direct, WiFi-LAN 연결 기능을 지원하게 되었습니다.":"The P2P chat system now supports BLE, Wi-Fi Direct, and Wi-Fi LAN connections.","부관(Aide)이 사용자에게 시스템 메시지를 전송하는 기능이 추가되었습니다.":"The Aide can now send system messages to users.","도구에 일기장(Diary) 기능이 추가되었습니다.":"A Diary feature was added to the tools.","Gray 캐릭터를 재구상하였습니다.":"I redesigned the Gray character concept.","생존 도구에 천문 도구(Astronomy Tool) 기능이 추가되었습니다.":"An Astronomy Tool was added to survival tools.","생존 도구에 비상 라디오 주파수(Emergency Radio Frequency) 기능이 추가되었습니다.":"Emergency Radio Frequencies were added to survival tools.","Brown 캐릭터를 구상하였습니다.":"I conceptualized the Brown character.","데이터 동기화(Data Sync) 기능이 추가되었습니다.":"Data Sync was added.","가로 모드(Landscape)뿐만 아니라 세로 모드(Portrait)까지 지원하여, 자유롭게 화면을 전환할 수 있게 되었습니다.":"The app now supports both landscape and portrait orientations, allowing users to switch freely between them.","P2P 채팅 시스템에 참여자 강퇴, 비밀 방 개설, 프로필 이미지 설정, 닉네임 설정 기능이 추가되었습니다.":"The P2P chat system added participant removal, private rooms, profile images, and nickname settings.","부관(Aide) Gray의 가스 마스크를 벗길 수 있는 트리거가 추가되었습니다.":"A trigger was added to remove Gray’s gas mask in the Aide feature.","오프라인 지도(Offline Map)에서 위도 경도 입력을 통한 마커 추가가 가능하게 되었습니다.":"Markers can now be added to the Offline Map by entering latitude and longitude.","PDF 출력 기능이 추가되었습니다.":"PDF export was added.","Google Play Store에서 내부 비공개 테스트를 시작하였습니다.":"Closed internal testing began on the Google Play Store."},"zh":{"대한민국 사상의 근간인 홍익인간 이념을 실천할 방법을 찾던 중, 다양한 재난 상황에서 도움을 제공할 수 있는 재난 대비 애플리케   ru: {title: '[Подготовка к бедствиям] Журнал разработки', updated: 'Последнее обновление', before2016: 'До 2016 года', dark: 'Тёмная тема', light: 'Светлая тема'}
};

function toggleTheme() {
  const body = document.body;
  const button = document.getElementById('theme-toggle');
  const lang = document.getElementById('lang-select').value;
  const labels = localeInfo[lang] || localeInfo.ko;
  if (body.getAttribute('data-theme') === 'dark') {
    body.removeAttribute('data-theme');
    button.textContent = labels.dark;
  } else {
    body.setAttribute('data-theme', 'dark');
    button.textContent = labels.light;
  }
}

function escapeHtml(value) {
  return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function inlineMarkdown(value) {
  let text = escapeHtml(value);
  text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img loading="lazy" alt="$1" src="$2">');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+|\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return text;
}

function localizedMarkdown(markdown, lang) {
  if (lang === 'ko') return markdown;
  const data = translations[lang] || translations.en;
  const labels = localeInfo[lang] || localeInfo.en;
  return markdown.split(/\r?\n/).map((line) => {
    const trimmed = line.trim();
    if (trimmed.startsWith('# ')) return '# ' + labels.title;
    if (trimmed.startsWith('> 마지막 수정일: ')) return '> ' + labels.updated + ': ' + trimmed.slice('> 마지막 수정일: '.length);
    if (trimmed === '## 2016년 이전') return '## ' + labels.before2016;
    if (trimmed.startsWith('- ')) {
      const original = trimmed.slice(2);
      return '- ' + (data[original] || original);
    }
    return line;
  }).join('\n');
}

  let list = false, entry = false, paragraph = [];
  const closeList = () => { if (list) { out.push('</ul>'); list = false; } };
  const closeParagraph = () => {
    if (paragraph.length) { out.push('<p>' + paragraph.map(inlineMarkdown).join('<br>') + '</p>'); paragraph = []; }
  };
  const closeEntry = () => {
    closeParagraph(); closeList();
    if (entry) { out.push('</section>'); entry = false; }
  };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeParagraph(); continue; }
    if (line === '---') { closeEntry(); continue; }
    if (line.startsWith('# ')) { closeEntry(); out.push('<header><h1>' + inlineMarkdown(line.slice(2)) + '</h1></header>'); continue; }
    if (line.startsWith('> ')) { closeParagraph(); closeList(); out.push('<p class="devlog-meta">' + inlineMarkdown(line.slice(2)) + '</p>'); continue; }
    if (line.startsWith('## ')) { closeEntry(); entry = true; out.push('<section class="devlog-entry"><h2>' + inlineMarkdown(line.slice(3)) + '</h2>'); continue; }
    if (line.startsWith('![')) { closeParagraph(); closeList(); out.push(inlineMarkdown(line)); continue; }
    if (line.startsWith('- ')) { closeParagraph(); if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inlineMarkdown(line.slice(2)) + '</li>'); continue; }
    closeList(); paragraph.push(line);
  }
  closeEntry();
  return out.join('\n');
}

function changeLanguage(requestedLang) {
  const select = document.getElementById('lang-select');
  const queryLang = new URLSearchParams(window.location.search).get('lang');
  const requested = requestedLang || select.value || queryLang || 'ko';
  const lang = localeInfo[requested] ? requested : 'ko';
  select.value = lang;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = localeInfo[lang].title;
  document.getElementById('theme-toggle').textContent = document.body.getAttribute('data-theme') === 'dark' ? localeInfo[lang].light : localeInfo[lang].dark;
  const source = document.getElementById('devlog-source').textContent;
  document.getElementById('devlog-content').innerHTML = renderMarkdown(localizedMarkdown(source, lang));
}

const urlLang = new URLSearchParams(window.location.search).get('lang');
changeLanguage(urlLang || 'ko');
</script>
